events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Coarse brake on sign-in posts per address, in front of the app's limits (failed sign-ins
    # per address, per-account lockout). Only POSTs count (an empty key is not limited): opening
    # the sign-in page is free. Generous, because a whole office signs in from one public address.
    map $request_method $login_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $login_limit_key zone=login_limit:10m rate=30r/m;
    limit_req_status 429;

    server_tokens off;

    upstream app {
        server app:80;
    }

    include /etc/nginx/inventory/headers.conf;

    log_format detailed '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';
    # To Docker's log (docker logs inventory_nginx), which the daemon rotates; a log file on
    # the host grew without limit.
    access_log /dev/stdout detailed;
    error_log /dev/stderr;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # The public domain (tunnel entry, 8080) may have other sites under it, so its HSTS leaves
    # subdomains alone.
    map $server_port $hsts {
        8080    "max-age=31536000";
        default "max-age=31536000; includeSubDomains";
    }

    # Requests through the tunnel are HTTPS at Cloudflare, though they reach nginx over HTTP.
    map $server_port $forwarded_proto {
        8080    https;
        default $scheme;
    }

    # The app trusts exactly one proxy hop: it takes the client address from the entry nginx
    # appends here, never from a header the client sent.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # The LAN entries' certificate (inventory166.az).
    ssl_certificate /etc/nginx/ssl/inventory166.crt;
    ssl_certificate_key /etc/nginx/ssl/inventory166.key;

    # The LAN entries (80/443: the server's IP 10.0.1.60, the retired inventory166.az, any other
    # name) no longer serve the app: everyone uses https://inventory.az, so every sign-in goes
    # through the same door and its limits. They only redirect there, keeping the path. The
    # certificate stays so browsers reach the redirect.
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        return 301 https://inventory.az$request_uri;
    }

    # Public entry: https://inventory.az through a Cloudflare Tunnel (the cloudflared service,
    # deploy/CLOUDFLARE.md). TLS ends at Cloudflare; cloudflared connects here over the compose
    # network. The port is not published on the host, so only containers on that network reach it
    # and the visitor's address in CF-Connecting-IP (set by Cloudflare) can be trusted.
    server {
        listen 8080;
        server_name _;

        real_ip_header CF-Connecting-IP;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;

        # One address, so one sign-in: www.inventory.az goes to inventory.az.
        if ($host ~* ^www\.(.+)$) {
            return 301 https://$1$request_uri;
        }

        # Visitors who typed http:// (if Cloudflare's "Always Use HTTPS" is off).
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        include /etc/nginx/inventory/app.conf;
    }

    # ServiceDesk calls the product API directly on :5001 with X-Api-Key, as it called the old
    # product-service published there. Plain HTTP on the LAN, and only what product-service served:
    # the UI and every other API stay behind HTTPS. This is the only entry that passes the key on
    # (app.conf drops it), and the app accepts it only on the product API.
    server {
        listen 5001;
        server_name _;

        location ~ ^/api/(products|categories|departments)(/|$) {
            proxy_pass http://app;
        }

        location /images/products/ {
            alias /app/storage/images/products/;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
