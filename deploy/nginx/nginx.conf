events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Coarse brute-force brake in front of the app's own per-IP login limiter.
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_status 429;

    upstream app {
        server app:80;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts always;

    log_format detailed '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';
    # To Docker's log (docker logs inventory_nginx), which the daemon rotates; a log file on
    # the host grew without limit.
    access_log /dev/stdout detailed;
    error_log /dev/stderr;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # The public domain (tunnel entry, 8080) may have other sites under it, so its HSTS leaves
    # subdomains alone.
    map $server_port $hsts {
        8080    "max-age=31536000";
        default "max-age=31536000; includeSubDomains";
    }

    # Requests through the tunnel are HTTPS at Cloudflare, though they reach nginx over HTTP.
    map $server_port $forwarded_proto {
        8080    https;
        default $scheme;
    }

    # The app trusts exactly one proxy hop: it takes the client address from the entry nginx
    # appends here, never from a header the client sent.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    server {
        listen 80;
        server_name inventory166.az www.inventory166.az 10.0.1.60;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name inventory166.az www.inventory166.az 10.0.1.60;

        ssl_certificate /etc/nginx/ssl/inventory166.crt;
        ssl_certificate_key /etc/nginx/ssl/inventory166.key;

        include /etc/nginx/app.conf;
    }

    # Public entry: https://inventory.az through a Cloudflare Tunnel (the cloudflared service,
    # deploy/CLOUDFLARE.md). TLS ends at Cloudflare; cloudflared connects here over the compose
    # network. The port is not published on the host, so only containers on that network reach it
    # and the visitor's address in CF-Connecting-IP (set by Cloudflare) can be trusted.
    server {
        listen 8080;
        server_name _;

        real_ip_header CF-Connecting-IP;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;

        # Visitors who typed http:// (if Cloudflare's "Always Use HTTPS" is off).
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        include /etc/nginx/app.conf;
    }

    # ServiceDesk calls the product API directly on :5001 with X-Api-Key, as it called the old
    # product-service published there (the old gateway required a Bearer token, so the key never
    # worked through /api on 443). Plain HTTP on the LAN, and only what product-service served:
    # the UI and every other API stay behind HTTPS.
    server {
        listen 5001;
        server_name _;

        location ~ ^/api/(products|categories|departments)(/|$) {
            proxy_pass http://app;
        }

        location /images/products/ {
            alias /app/storage/images/products/;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
