events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Coarse brute-force brake in front of the app's own per-IP login limiter.
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_status 429;

    upstream app {
        server app:80;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    log_format detailed '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log detailed;
    error_log /var/log/nginx/error.log;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # The app trusts exactly one proxy hop: it takes the client address from the entry nginx
    # appends here, never from a header the client sent.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name inventory166.az www.inventory166.az 10.0.1.60;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name inventory166.az www.inventory166.az 10.0.1.60;

        ssl_certificate /etc/nginx/ssl/inventory166.crt;
        ssl_certificate_key /etc/nginx/ssl/inventory166.key;

        client_max_body_size 20M;

        location / {
            proxy_pass http://app;
        }

        location = /Account/Login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://app;
        }

        location = /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://app;
        }

        # SignalR (WebSockets, long-lived).
        location /notificationHub {
            proxy_pass http://app;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Uploaded images straight from the shared volume. File names are unique per upload,
        # so they can be cached forever.
        location /images/products/ {
            alias /app/storage/images/products/;
            expires 365d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location /images/routes/ {
            alias /app/storage/images/routes/;
            expires 365d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # ServiceDesk calls the product API directly on :5001 with X-Api-Key, as it called the old
    # product-service published there (the old gateway required a Bearer token, so the key never
    # worked through /api on 443). Plain HTTP on the LAN, and only what product-service served:
    # the UI and every other API stay behind HTTPS.
    server {
        listen 5001;
        server_name _;

        location ~ ^/api/(products|categories|departments)(/|$) {
            proxy_pass http://app;
        }

        location /images/products/ {
            alias /app/storage/images/products/;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
