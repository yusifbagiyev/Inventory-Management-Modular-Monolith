events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Coarse brake on sign-in POSTs per address, generous because a whole office shares one address
    map $request_method $login_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $login_limit_key zone=login_limit:10m rate=30r/m;
    limit_req_status 429;

    server_tokens off;

    upstream app {
        server app:80;
    }

    include /etc/nginx/inventory/headers.conf;

    log_format detailed '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';
    # Log to Docker, which rotates the logs as docker-compose.yml sets, instead of a host file that grows without limit
    access_log /dev/stdout detailed;
    error_log /dev/stderr;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # The public domain may have other sites under it, so the tunnel entry leaves subdomains out of HSTS
    map $server_port $hsts {
        8080    "max-age=31536000";
        default "max-age=31536000; includeSubDomains";
    }

    # Requests through the tunnel are HTTPS at Cloudflare, though they reach nginx over HTTP
    map $server_port $forwarded_proto {
        8080    https;
        default $scheme;
    }

    # The app trusts one proxy hop, so it reads the address nginx appends and not one the client sent
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # Certificate for the LAN entry on the server's IP
    ssl_certificate /etc/nginx/ssl/inventory166.crt;
    ssl_certificate_key /etc/nginx/ssl/inventory166.key;

    # The retired inventory166.az gets no answer, neither a TLS handshake nor an HTTP reply
    server {
        listen 80;
        listen 443 ssl;
        server_name inventory166.az www.inventory166.az;
        ssl_reject_handshake on;
        return 444;
    }

    # The LAN entries only redirect to inventory.az, so every sign-in goes through the same door and its limits
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        return 301 https://inventory.az$request_uri;
    }

    # Public entry for inventory.az through the Cloudflare Tunnel, with TLS ending at Cloudflare
    server {
        listen 8080;
        server_name _;

        # The port is not published on the host, so CF-Connecting-IP can only come from cloudflared
        real_ip_header CF-Connecting-IP;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;

        # One host name means one sign-in cookie
        if ($host ~* ^www\.(.+)$) {
            return 301 https://$1$request_uri;
        }

        # Only reached when Cloudflare's Always Use HTTPS is off
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        include /etc/nginx/inventory/app.conf;
    }

    # Plain HTTP LAN entry for ServiceDesk, the only one passing X-Api-Key on and serving just the product API
    server {
        listen 5001;
        server_name _;

        location ~ ^/api/(products|categories|departments)(/|$) {
            proxy_pass http://app;
        }

        location /images/products/ {
            alias /app/storage/images/products/;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
