# The application's locations, shared by the LAN entry (443) and the Cloudflare Tunnel entry
# (8080) in nginx.conf.

client_max_body_size 20M;

# The ServiceDesk API key is only accepted on the LAN port 5001 (its own server block); here it is
# dropped so a leaked key is useless from the internet. Setting a header at this level replaces
# the http-level ones, so all are repeated.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Api-Key "";

location / {
    proxy_pass http://app;
}

location = /Account/Login {
    limit_req zone=login_limit burst=20 nodelay;
    proxy_pass http://app;
}

location = /api/auth/login {
    limit_req zone=login_limit burst=20 nodelay;
    proxy_pass http://app;
}

# SignalR (WebSockets, long-lived). Setting a header here drops the http-level ones, so all are
# repeated.
location /notificationHub {
    proxy_pass http://app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Api-Key "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# Uploaded images straight from the shared volume. File names are unique per upload,
# so they can be cached forever.
location /images/products/ {
    alias /app/storage/images/products/;
    expires 365d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/inventory/headers.conf;
    try_files $uri =404;
}

location /images/routes/ {
    alias /app/storage/images/routes/;
    expires 365d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/inventory/headers.conf;
    try_files $uri =404;
}
