# The application's locations, included by the tunnel entry in nginx.conf

client_max_body_size 20M;

# Setting a header here replaces the http-level ones, so all are repeated
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# A leaked API key is useless from the internet, since it only works on port 5001
proxy_set_header X-Api-Key "";

location / {
    proxy_pass http://app;
}

# A save carries up to ten photos of 5 MB each, so the product and transfer forms and their API take more than the rest
location ~* ^/(products/(create|edit)|routes/(transfer|edit)|api/(products|inventoryroutes))(/|$) {
    client_max_body_size 55m;
    proxy_pass http://app;
}

location = /Account/Login {
    limit_req zone=login_limit burst=20 nodelay;
    proxy_pass http://app;
}

location = /api/auth/login {
    limit_req zone=login_limit burst=20 nodelay;
    proxy_pass http://app;
}

# SignalR keeps WebSockets open for a long time, and the headers are repeated as above
location /notificationHub {
    proxy_pass http://app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Api-Key "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}

# Uploaded images come straight from the volume and every upload gets a new name, so they cache forever
location /images/products/ {
    alias /app/storage/images/products/;
    expires 365d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/inventory/headers.conf;
    try_files $uri =404;
}

location /images/routes/ {
    alias /app/storage/images/routes/;
    expires 365d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/inventory/headers.conf;
    try_files $uri =404;
}
