# Security headers, included at the http level and again in every location that sets its own
# add_header (nginx then drops the inherited ones; the /images locations set Cache-Control).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security $hsts always;
# An internal system: search engines must not list even the sign-in page (robots.txt says the same).
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
# A baseline that breaks nothing: no framing by other sites, no plugins, no <base> or form
# posts to other origins. Scripts are not restricted yet (the pages still use inline scripts).
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
