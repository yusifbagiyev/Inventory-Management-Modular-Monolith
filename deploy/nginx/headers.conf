# Security headers. Include this again in any location with its own add_header, since nginx then drops the inherited ones.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security $hsts always;
# An internal system. Search engines must not list even the sign-in page.
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
# A baseline CSP that breaks nothing. Scripts are not restricted yet because the pages still use inline scripts.
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
