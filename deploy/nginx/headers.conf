# Include again in any location with its own add_header, since nginx then drops the inherited ones
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security $hsts always;
# Search engines must not list even the sign-in page of an internal system
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
# Baseline CSP that leaves scripts unrestricted, since the pages use inline scripts
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
