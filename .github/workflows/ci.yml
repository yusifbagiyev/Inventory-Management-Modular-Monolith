name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InventoryManagement.sln

      - name: Build
        run: dotnet build InventoryManagement.sln --no-restore -c Release

      # Integration tests start PostgreSQL through Testcontainers (Docker is available on the runner).
      - name: Test
        run: dotnet test InventoryManagement.sln --no-build -c Release --logger "console;verbosity=normal"

      - name: Vulnerable packages
        run: |
          dotnet list InventoryManagement.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q '>' vulnerable.txt

      - name: Docker image
        run: docker build -t inventory-app:ci .
