name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04   # Pinned so the move of ubuntu-latest to 26.04 does not catch us by surprise
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InventoryManagement.sln

      - name: Build
        run: dotnet build InventoryManagement.sln --no-restore -c Release

      - name: Vulnerable packages
        run: |
          # The command exits 0 either way, so fail on any listed package, which is marked with >
          dotnet list InventoryManagement.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q '>' vulnerable.txt

      - name: Docker image
        run: docker build -t inventory-app:ci .
