name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04   # Pinned so the move of ubuntu-latest to 26.04 does not catch us by surprise
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InventoryManagement.sln

      - name: Build
        run: dotnet build InventoryManagement.sln --no-restore -c Release

      - name: Vulnerable packages
        run: |
          # The command exits 0 either way, so fail on any listed package, which is marked with >
          dotnet list InventoryManagement.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q '>' vulnerable.txt

      - name: nginx configuration
        run: |
          # nginx -t reads the certificate and looks up the app, so both get a stand-in here
          mkdir -p ssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci \
            -keyout ssl/inventory166.key -out ssl/inventory166.crt 2> /dev/null
          docker compose --env-file .env.example run --rm --no-deps -T nginx \
            sh -c 'echo "127.0.0.1 app" >> /etc/hosts && nginx -t'

      - name: Docker image
        run: docker build -t inventory-app:ci .
