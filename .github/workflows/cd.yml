name: CD

# After CI passes on master, builds the image, pushes it to ghcr.io and deploys it through the self-hosted runner

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Deploy this existing tag instead of building (rollback), e.g. sha-4c38823...'
        required: false
        default: ''

# One deployment at a time and in the order the runs arrive, never cancelled half-way
# Every run waits its turn, so one with nothing to deploy cannot take the place of a waiting deployment
concurrency:
  group: production
  cancel-in-progress: false
  queue: max

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/inventory-app

jobs:
  image:
    # Only pushes to this repository build, so pull requests and forks never reach the self-hosted runner
    if: >-
      !inputs.image_tag &&
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04   # Pinned so the move of ubuntu-latest to 26.04 does not catch us by surprise
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The commit CI tested, not whatever master points at by now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # CI runs finish in any order and can be run again, and an older commit must not replace a newer one
      - id: tip
        if: github.event_name == 'workflow_run'
        run: |
          tip=$(git ls-remote origin refs/heads/master | cut -f1)
          [ -n "$tip" ] || { echo "Could not read the tip of master"; exit 1; }
          if [ "$tip" != "$(git rev-parse HEAD)" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::master is at $tip by now, so this commit is neither built nor deployed"
          fi

      - id: tag
        if: steps.tip.outputs.stale != 'true'
        run: echo "tag=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.tip.outputs.stale != 'true'

      - uses: docker/login-action@v4
        if: steps.tip.outputs.stale != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        if: steps.tip.outputs.stale != 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # Runs after a build that produced an image or alone for a rollback, and only while CD_ENABLED is true
    if: >-
      always() && vars.CD_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master') &&
      ((needs.image.result == 'success' && needs.image.outputs.tag) ||
       (needs.image.result == 'skipped' && inputs.image_tag))
    runs-on: [self-hosted, inventory-prod]
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      TAG: ${{ inputs.image_tag || needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check setup
        run: |
          test -n "$DEPLOY_DIR" || { echo "Set the DEPLOY_DIR repository variable (deploy/CD.md)"; exit 1; }
          test -f "$DEPLOY_DIR/.env" || { echo "$DEPLOY_DIR/.env is missing"; exit 1; }
          [[ "$TAG" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "Invalid image tag: $TAG"; exit 1; }

      # Server-specific values belong in .env and docker-compose.override.yml, which are never overwritten
      - name: Sync deployment files
        run: |
          # deploy.sh puts the files of the last successful deploy back when one fails and keeps that copy itself afterwards
          if [ ! -d "$DEPLOY_DIR/.previous" ] && [ -f "$DEPLOY_DIR/docker-compose.yml" ] && [ -d "$DEPLOY_DIR/deploy/nginx" ]; then
            rm -rf "$DEPLOY_DIR/.previous.tmp"
            mkdir -p "$DEPLOY_DIR/.previous.tmp/deploy"
            cp "$DEPLOY_DIR/docker-compose.yml" "$DEPLOY_DIR/.previous.tmp/"
            cp -R "$DEPLOY_DIR/deploy/nginx" "$DEPLOY_DIR/.previous.tmp/deploy/"
            mv "$DEPLOY_DIR/.previous.tmp" "$DEPLOY_DIR/.previous"
          fi
          cp docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          mkdir -p "$DEPLOY_DIR/deploy"
          cp -R deploy/. "$DEPLOY_DIR/deploy/"

      - name: Log in to ghcr.io
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Deploy
        run: bash "$DEPLOY_DIR/deploy/deploy.sh" "$IMAGE:$TAG"

      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
