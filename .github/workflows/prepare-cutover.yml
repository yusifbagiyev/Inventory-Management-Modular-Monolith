name: Prepare cut-over

# One-time, manual. Stages the modular monolith next to the running old stack on the production
# server without touching it: next/ gets the compose file, deploy/ and the image tag, and the image
# is pulled so the cut-over needs no registry access. deploy/cutover.sh then does the switch
# (deploy/MIGRATION.md). Safe to run again; it only replaces next/.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to stage; empty = sha-<this commit> (built by CD once CI passed)'
        required: false
        default: ''

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, inventory-prod]
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/inventory166' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/inventory-app
      TAG: ${{ inputs.image_tag || format('sha-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "Invalid image tag: $TAG"; exit 1; }
          test -f "$DEPLOY_DIR/.env" || { echo "$DEPLOY_DIR/.env is missing"; exit 1; }
          test ! -f "$DEPLOY_DIR/docker-compose.old.yml" || { echo "The cut-over already ran in $DEPLOY_DIR"; exit 1; }

      - name: Log in to ghcr.io
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Pull the image
        run: |
          docker pull "$IMAGE:$TAG" || {
            echo "Image $IMAGE:$TAG not found - wait for the CD run of this commit to finish, then run this again."
            exit 1
          }

      - name: Stage next/
        run: |
          rm -rf "$DEPLOY_DIR/next"
          mkdir -p "$DEPLOY_DIR/next"
          cp docker-compose.yml "$DEPLOY_DIR/next/"
          cp -R deploy "$DEPLOY_DIR/next/deploy"
          echo "$IMAGE:$TAG" > "$DEPLOY_DIR/next/APP_IMAGE"
          ls -la "$DEPLOY_DIR/next"
          echo "Staged $IMAGE:$TAG. Next: on the server, as root: cd $DEPLOY_DIR && bash next/deploy/cutover.sh check"

      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
