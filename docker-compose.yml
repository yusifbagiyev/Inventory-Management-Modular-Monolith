# The app behind nginx, PostgreSQL with a schema per module and Seq for logs, with secrets from .env

services:
  postgres:
    image: postgres:15-alpine
    container_name: inventory_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    # Published for administration from the LAN, so drop it or bind it to 127.0.0.1 if nobody needs that
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: always
    healthcheck:
      # Without -d it connects to a database named after the user, which logs an error every check
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # CD pins APP_IMAGE in .env to the deployed tag, otherwise up --build builds a local image
    image: ${APP_IMAGE:-inventory-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_app
    environment:
      - TZ=${TZ:-UTC}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${DB_NAME:-inventory};Username=${DB_USER};Password=${DB_PASSWORD}
      # JWT is only for external /api clients since the UI uses the auth cookie
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - WhatsApp__ApiUrl=https://wasenderapi.com/api/
      - WhatsApp__ApiToken=${WHATSAPP_API_TOKEN}
      - WhatsApp__DefaultGroupId=${WHATSAPP_GROUP_ID}
      # ServiceDesk integration, which stays off while SERVICEDESK_API_KEY is empty
      - ApiKeys__0__Key=${SERVICEDESK_API_KEY:-}
      - ApiKeys__0__ServiceName=ServiceDesk
      - ApiKeys__0__ServiceId=servicedesk-001
      - ApiKeys__0__Permissions__0=product.view
      - ImageSettings__RootPath=/app/wwwroot/images
      # Persisted so sign-in cookies and antiforgery tokens survive a redeploy
      - DataProtection__KeysPath=/app/keys
    volumes:
      # The whole images folder, so thumbnails survive a deploy too
      - ./storage/images:/app/wwwroot/images:rw
      - ./storage/keys:/app/keys:rw
    # Healthy once migrations ran and the database answers, which is what deploy.sh waits for
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - backend
      - frontend
    restart: always

  seq:
    # Pinned because Seq keeps state in seq_data, so it is only upgraded on purpose
    image: datalust/seq:2025.2.14476
    container_name: inventory_seq
    environment:
      - TZ=${TZ:-UTC}
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD}
      - SEQ_API_CANONICALURI=http://seq
      - SEQ_CACHE_SYSTEMRAMTARGET=0.2
    ports:
      - "5342:80"
    volumes:
      - seq_data:/data
    networks:
      - backend
    restart: always

  nginx:
    image: nginx:1.29-alpine
    container_name: inventory_nginx
    ports:
      - "80:80"
      - "443:443"
      # Product API for ServiceDesk on the LAN
      - "5001:5001"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # The files nginx.conf includes
      - ./deploy/nginx:/etc/nginx/inventory:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./storage/images/products:/app/storage/images/products:ro
      - ./storage/images/routes:/app/storage/images/routes:ro
    depends_on:
      - app
    networks:
      - frontend
    restart: always

  # Outbound Cloudflare Tunnel for public access, run only with COMPOSE_PROFILES=tunnel and its token
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: inventory_cloudflared
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    networks:
      - frontend
    restart: always

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres_data:
  seq_data:
