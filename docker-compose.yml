# Modular monolith: one app container behind nginx, one PostgreSQL database (a schema per module),
# Seq for logs. Secrets come from .env (see .env.example). Cut-over from the old per-service stack:
# deploy/MIGRATION.md.

services:
  postgres:
    image: postgres:15-alpine
    container_name: inventory_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    # Published for administration from the LAN. Remove, or bind to 127.0.0.1, if not needed.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_app
    environment:
      - TZ=${TZ:-UTC}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${DB_NAME:-inventory};Username=${DB_USER};Password=${DB_PASSWORD}
      # JWT is only for external /api clients; the UI uses the auth cookie.
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - WhatsApp__ApiUrl=https://wasenderapi.com/api/
      - WhatsApp__ApiToken=${WHATSAPP_API_TOKEN}
      - WhatsApp__DefaultGroupId=${WHATSAPP_GROUP_ID}
      # ServiceDesk integration (X-Api-Key). Leave SERVICEDESK_API_KEY empty to disable.
      - ApiKeys__0__Key=${SERVICEDESK_API_KEY:-}
      - ApiKeys__0__ServiceName=ServiceDesk
      - ApiKeys__0__ServiceId=servicedesk-001
      - ApiKeys__0__Permissions__0=product.view
      - ImageSettings__RootPath=/app/wwwroot/images
      # Persisted so sign-in cookies and antiforgery tokens survive container restarts.
      - DataProtection__KeysPath=/app/keys
    volumes:
      - ./storage/images/products:/app/wwwroot/images/products:rw
      - ./storage/images/routes:/app/wwwroot/images/routes:rw
      - ./storage/keys:/app/keys:rw
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - backend
      - frontend
    restart: always

  seq:
    image: datalust/seq:latest
    container_name: inventory_seq
    environment:
      - TZ=${TZ:-UTC}
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD}
      - SEQ_API_CANONICALURI=http://seq
      - SEQ_CACHE_SYSTEMRAMTARGET=0.2
    ports:
      - "5342:80"
    volumes:
      - seq_data:/data
    networks:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: inventory_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs:/var/log/nginx
      - ./storage/images/products:/app/storage/images/products:ro
      - ./storage/images/routes:/app/storage/images/routes:ro
    depends_on:
      - app
    networks:
      - frontend
    restart: always

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres_data:
  seq_data:
