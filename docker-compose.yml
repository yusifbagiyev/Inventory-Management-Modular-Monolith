# Modular monolith: one app container behind nginx, one PostgreSQL database (a schema per module),
# Seq for logs. Secrets come from .env (see .env.example). Cut-over from the old per-service stack:
# deploy/MIGRATION.md.

services:
  postgres:
    image: postgres:15-alpine
    container_name: inventory_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    # Published for administration from the LAN. Remove, or bind to 127.0.0.1, if not needed.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # CD sets APP_IMAGE in .env to the deployed ghcr.io tag (deploy/CD.md). Without it,
    # `docker compose up --build` builds a local image from this checkout.
    image: ${APP_IMAGE:-inventory-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_app
    environment:
      - TZ=${TZ:-UTC}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${DB_NAME:-inventory};Username=${DB_USER};Password=${DB_PASSWORD}
      # JWT is only for external /api clients; the UI uses the auth cookie.
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - WhatsApp__ApiUrl=https://wasenderapi.com/api/
      - WhatsApp__ApiToken=${WHATSAPP_API_TOKEN}
      - WhatsApp__DefaultGroupId=${WHATSAPP_GROUP_ID}
      # ServiceDesk integration (X-Api-Key). Leave SERVICEDESK_API_KEY empty to disable.
      - ApiKeys__0__Key=${SERVICEDESK_API_KEY:-}
      - ApiKeys__0__ServiceName=ServiceDesk
      - ApiKeys__0__ServiceId=servicedesk-001
      - ApiKeys__0__Permissions__0=product.view
      - ImageSettings__RootPath=/app/wwwroot/images
      # Persisted so sign-in cookies and antiforgery tokens survive container restarts.
      - DataProtection__KeysPath=/app/keys
    volumes:
      - ./storage/images/products:/app/wwwroot/images/products:rw
      - ./storage/images/routes:/app/wwwroot/images/routes:rw
      - ./storage/keys:/app/keys:rw
    # Healthy once migrations ran and the database answers. deploy/deploy.sh waits on this.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - backend
      - frontend
    restart: always

  seq:
    # Pinned: Seq keeps state in seq_data, so upgrade deliberately (change this tag).
    image: datalust/seq:2025.2.14476
    container_name: inventory_seq
    environment:
      - TZ=${TZ:-UTC}
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD}
      - SEQ_API_CANONICALURI=http://seq
      - SEQ_CACHE_SYSTEMRAMTARGET=0.2
    ports:
      - "5342:80"
    volumes:
      - seq_data:/data
    networks:
      - backend
    restart: always

  nginx:
    image: nginx:1.29-alpine
    container_name: inventory_nginx
    ports:
      - "80:80"
      - "443:443"
      # Product API for ServiceDesk (X-Api-Key), as the old product-service offered it (nginx.conf).
      - "5001:5001"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/app.conf:/etc/nginx/app.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./storage/images/products:/app/storage/images/products:ro
      - ./storage/images/routes:/app/storage/images/routes:ro
    depends_on:
      - app
    networks:
      - frontend
    restart: always

  # Public access (https://inventory.az) through a Cloudflare Tunnel: an outbound connection to
  # Cloudflare, so no port is opened on the server or the firewall. It reaches nginx's tunnel entry
  # (nginx:8080, not published). Runs only with COMPOSE_PROFILES=tunnel and the tunnel's token in
  # .env; setup in deploy/CLOUDFLARE.md.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: inventory_cloudflared
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    networks:
      - frontend
    restart: always

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres_data:
  seq_data:
